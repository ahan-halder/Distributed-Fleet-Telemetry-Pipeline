apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-gateway
  labels:
    app: telemetry-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telemetry-gateway
  template:
    metadata:
      labels:
        app: telemetry-gateway
    spec:
      containers:
      - name: gateway
        image: gcr.io/your-project/telemetry-gateway:latest
        ports:
        - containerPort: 50051
        env:
        - name: MODE
          value: "gcp"
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-gateway
spec:
  type: LoadBalancer
  selector:
    app: telemetry-gateway
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
