apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-gateway
  namespace: fleet
  annotations:
    linkerd.io/inject: enabled
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telemetry-gateway
  template:
    metadata:
      labels:
        app: telemetry-gateway
    spec:
      containers:
        - name: gateway
          image: gcr.io/your-project/telemetry-gateway:latest
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8080
              name: rest
          env:
            - name: BIGTABLE_PROJECT
              valueFrom:
                secretKeyRef:
                  name: gcp-config
                  key: project_id
            - name: BIGTABLE_INSTANCE
              valueFrom:
                secretKeyRef:
                  name: gcp-config
                  key: bigtable_instance
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
          readinessProbe:
            grpc:
              port: 50051
              service: fleet.telemetry.v1.TelemetryService
            initialDelaySeconds: 5
