apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-proxy
  namespace: fleet
  annotations:
    linkerd.io/inject: enabled
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rest-proxy
  template:
    metadata:
      labels:
        app: rest-proxy
    spec:
      containers:
        - name: rest-proxy
          image: gcr.io/your-project/telemetry-rest-proxy:latest
          args:
            - "-gateway-endpoint=telemetry-gateway.fleet.svc.cluster.local:50051"
            - "-port=8080"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
