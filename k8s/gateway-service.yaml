apiVersion: v1
kind: Service
metadata:
  name: telemetry-gateway
  namespace: fleet
  labels:
    app: telemetry-gateway
spec:
  type: LoadBalancer
  selector:
    app: telemetry-gateway
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
    - name: rest
      protocol: TCP
      port: 8080
      targetPort: 8080
